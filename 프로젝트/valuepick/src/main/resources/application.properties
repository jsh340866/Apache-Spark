spring.application.name=demo

# MySQL Connection Settings (실제 값은 application-{profile}.properties 에서 주입)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Settings
jwt.secret=${JWT_SECRET}

# DART API Settings
dart.api.key=${DART_API_KEY}

# Stock(공공데이터) API Settings
stock.api.key=${STOCK_API_KEY}
stock.api.base-url=https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo

# 한국수출입은행 환율 API (https://www.koreaexim.go.kr 에서 발급)
koreaexim.api.key=${KOREAEXIM_API_KEY}

# KRX 정보데이터시스템 Open API (https://data.krx.co.kr 에서 발급)
krx.api.key=${KRX_API_KEY}
