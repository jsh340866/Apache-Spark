# spark-submit 시 공통 적용되는 기본 설정
# worker-1, worker-2 각 2코어 = 총 4코어 -> shuffle partition 기본값(200)이 과도하므로 축소
spark.sql.shuffle.partitions          4

# executor 메모리 미지정 시 Spark 기본값(1g)이 적용되어, 04_backtest_grid.py처럼 crossJoin+cache가
# 무거운 잡에서 executor가 힙 부족으로 강제 종료(exitStatus 143)되는 게 실측으로 확인됨
# (docker logs spark-worker-1/2에서 -Xmx1024M, "finished with state KILLED" 반복 관측).
# 워커 한 대가 --memory 3G이고 워커당 executor 1개가 그 메모리 전체를 쓰므로,
# OS/JVM 오버헤드 여유를 남기고 2g로 지정한다.
#
# [환경의존] 2g는 집 컴퓨터(호스트 31.9GB) 기준. 학원 컴퓨터(7.7GB)에서는 1g로 되돌릴 것.
# 상세: docs/ENVIRONMENT.md
spark.executor.memory                 2g

# 04_backtest_grid.py의 종목 마스터(2,500행) broadcast join 힌트가 자동 적용되도록 임계값 설정 (10MB)
spark.sql.autoBroadcastJoinThreshold  10485760

# 마스터 접속 정보 (docker-compose 서비스명 기준)
spark.master                          spark://spark-master:7077

# 이벤트 로그: 드라이버 UI(4040)는 잡이 살아있는 동안만 뜨고 죽으면 기록이 통째로 사라진다.
# 2026-07-30~31에 04번이 세 번 실패했을 때 "어느 스테이지에서 멈췄는지"를 사후 확인할 방법이
# 없어 원인 판정이 불가능했다. 이벤트 로그를 남기면 spark-history(18080)에서 종료 후에도 조회된다.
# dir을 마운트된 경로(/opt/spark-apps/logs)로 두는 이유: 컨테이너 내부 경로에 쓰면 컨테이너를
# 재생성할 때 로그가 같이 사라져 목적을 잃는다.
spark.eventLog.enabled                true
spark.eventLog.dir                    file:///opt/spark-apps/logs/events
