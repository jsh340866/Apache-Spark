name: ml_jupyter

services:
  # [1] 지휘관이자 마스터 역할 (주피터 노트북)
  jupyter:
    image: jupyter/all-spark-notebook:latest
    container_name: jupyter-ml
    mem_limit: 4g
    user: root
    ports:
      - "9999:8888"   # 주피터 노트북 웹 UI (로컬 전용)
      - "4040:4040"   # 스파크 작업 모니터링 UI (중요!)
      - "8080:8080"   # 스파크 마스터 관리자 UI
    environment:
      - SPARK_MASTER_HOST=jupyter
    volumes:
      - ./work:/home/jovyan/work
    command: >
      bash -c "pip uninstall -y bottleneck numexpr pyarrow &&
               /usr/local/spark/sbin/start-master.sh &&
               start-notebook.sh --IdentityProvider.token=''"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/jupyter/7077'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # [2] 첫 번째 진짜 일꾼 컨테이너
  spark-worker-1:
    image: jupyter/all-spark-notebook:latest
    container_name: spark-worker-1
    mem_limit: 2g   # 일꾼 1호의 메모리 제한
    user: root
    environment:
      - SPARK_WORKER_MEMORY=1500m
      - SPARK_WORKER_CORES=1
    depends_on:
      jupyter:
        condition: service_healthy
    volumes:
      - ./work:/home/jovyan/work
    command: >
      bash -c "/usr/local/spark/sbin/start-worker.sh spark://jupyter:7077 && tail -f /dev/null"
    restart: unless-stopped

  # [3] 두 번째 진짜 일꾼 컨테이너
  spark-worker-2:
    image: jupyter/all-spark-notebook:latest
    container_name: spark-worker-2
    mem_limit: 2g   # 일꾼 2호의 메모리 제한
    user: root
    environment:
      - SPARK_WORKER_MEMORY=1500m
      - SPARK_WORKER_CORES=1
    depends_on:
      jupyter:
        condition: service_healthy
    volumes:
      - ./work:/home/jovyan/work
    command: >
      bash -c "/usr/local/spark/sbin/start-worker.sh spark://jupyter:7077 && tail -f /dev/null"
    restart: unless-stopped
